version: 2

dimensions:
  # Измерения заказа
  - name: order_status_dim
    description: "Статус заказа"
    type: categorical
    sql: O_ORDERSTATUS
    values:
      - value: "O"
        label: "Open"
      - value: "F"
        label: "Filled"
      - value: "P"
        label: "Pending"
    references:
      - semantic_model: orders_analysis
        dimension: order_status
      - semantic_model: order_history
        dimension: order_status

  - name: order_priority_dim
    description: "Приоритет заказа"
    type: categorical
    sql: O_ORDERPRIORITY
    values:
      - value: "1-URGENT"
        label: "Ургент"
      - value: "2-HIGH"
        label: "Высокий"
      - value: "3-MEDIUM"
        label: "Средний"
      - value: "4-NOT SPECIFIED"
        label: "Не указан"
      - value: "5-LOW"
        label: "Низкий"
    references:
      - semantic_model: orders_analysis
        dimension: order_priority
      - semantic_model: order_history
        dimension: order_priority

  # Измерения клиента
  - name: customer_segment_dim
    description: "Сегмент клиента"
    type: categorical
    sql: C_MKTSEGMENT
    values:
      - value: "AUTOMOBILE"
        label: "Автомобили"
      - value: "BUILDING"
        label: "Строительство"
      - value: "FURNITURE"
        label: "Мебель"
      - value: "HOUSEHOLD"
        label: "Товары для дома"
      - value: "MACHINERY"
        label: "Машины и оборудование"
    references:
      - semantic_model: customer_history
        dimension: customer_segment

  # Измерения товара
  - name: product_type_dim
    description: "Тип товара"
    type: categorical
    sql: P_TYPE
    references:
      - semantic_model: lineitem_details
        dimension: product_type

  - name: product_size_dim
    description: "Размер товара"
    type: categorical
    sql: P_SIZE
    references:
      - semantic_model: lineitem_details
        dimension: product_size

  # Измерения доставки
  - name: ship_mode_dim
    description: "Способ доставки"
    type: categorical
    sql: L_SHIPMODE
    references:
      - semantic_model: lineitem_details
        dimension: ship_mode

  - name: return_flag_dim
    description: "Флаг возврата"
    type: categorical
    sql: L_RETURNFLAG
    values:
      - value: "R"
        label: "Возвращен"
      - value: "N"
        label: "Не возвращен"
    references:
      - semantic_model: lineitem_details
        dimension: return_flag

  - name: line_status_dim
    description: "Статус позиции"
    type: categorical
    sql: L_LINESTATUS
    values:
      - value: "F"
        label: "Завершена"
      - value: "O"
        label: "В процессе"
    references:
      - semantic_model: lineitem_details
        dimension: line_status

  # Временные измерения с разными гранулярностями
  - name: order_month
    description: "Месяц заказа"
    type: time
    sql: toYearMonth(O_ORDERDATE)
    type_params:
      time_granularity: month
    references:
      - semantic_model: orders_analysis
        dimension: order_month
      - semantic_model: lineitem_details
        dimension: order_month
      - semantic_model: calendar
        dimension: month

  - name: order_quarter
    description: "Квартал заказа"
    type: time
    sql: toStartOfQuarter(O_ORDERDATE)
    type_params:
      time_granularity: quarter
    references:
      - semantic_model: orders_analysis
        dimension: order_quarter
      - semantic_model: lineitem_details
        dimension: order_quarter
      - semantic_model: calendar
        dimension: quarter

  - name: order_week
    description: "Неделя заказа"
    type: time
    sql: toStartOfWeek(O_ORDERDATE, 1)
    type_params:
      time_granularity: week
    references:
      - semantic_model: orders_analysis
        dimension: order_week
      - semantic_model: lineitem_details
        dimension: order_week
      - semantic_model: calendar
        dimension: week_of_year

  - name: order_year_month
    description: "Год и месяц заказа"
    type: categorical
    sql: toString(toYear(O_ORDERDATE)) + '-' + lpad(toString(toMonth(O_ORDERDATE)), 2, '0')
    references:
      - semantic_model: orders_analysis
        dimension: order_year_month
      - semantic_model: lineitem_details
        dimension: order_year_month
      - semantic_model: calendar
        dimension: year_month

  - name: order_quarter_name
    description: "Название квартала"
    type: categorical
    sql: toString(toYear(O_ORDERDATE)) + '-Q' + toString(toQuarter(O_ORDERDATE))
    references:
      - semantic_model: orders_analysis
        dimension: order_quarter_name
      - semantic_model: lineitem_details
        dimension: order_quarter_name
      - semantic_model: calendar
        dimension: quarter_name

  - name: season
    description: "Время года"
    type: categorical
    sql: CASE WHEN toMonth(O_ORDERDATE) BETWEEN 3 AND 5 THEN 'Spring' WHEN toMonth(O_ORDERDATE) BETWEEN 6 AND 8 THEN 'Summer' WHEN toMonth(O_ORDERDATE) BETWEEN 9 AND 11 THEN 'Autumn' ELSE 'Winter' END
    references:
      - semantic_model: orders_analysis
        dimension: season
      - semantic_model: lineitem_details
        dimension: season
      - semantic_model: calendar
        dimension: season

  - name: half_year
    description: "Полугодие"
    type: categorical
    sql: 'H' + toString(intDiv(toMonth(O_ORDERDATE) - 1, 6) + 1)
    references:
      - semantic_model: orders_analysis
        dimension: half_year
      - semantic_model: lineitem_details
        dimension: half_year
      - semantic_model: calendar
        dimension: half_year

  - name: day_of_week
    description: "День недели"
    type: categorical
    sql: toDayOfWeek(O_ORDERDATE)
    values:
      - value: 1
        label: "Понедельник"
      - value: 2
        label: "Вторник"
      - value: 3
        label: "Среда"
      - value: 4
        label: "Четверг"
      - value: 5
        label: "Пятница"
      - value: 6
        label: "Суббота"
      - value: 7
        label: "Воскресенье"
    references:
      - semantic_model: orders_analysis
        dimension: day_of_week
      - semantic_model: lineitem_details
        dimension: day_of_week
      - semantic_model: calendar
        dimension: day_of_week

  - name: is_weekend
    description: "Выходной день"
    type: categorical
    sql: if(toDayOfWeek(O_ORDERDATE) IN (1, 7), true, false)
    values:
      - value: true
        label: "Выходной"
      - value: false
        label: "Рабочий"
    references:
      - semantic_model: orders_analysis
        dimension: is_weekend
      - semantic_model: lineitem_details
        dimension: is_weekend
      - semantic_model: calendar
        dimension: is_weekend

  - name: is_business_day
    description: "Рабочий день"
    type: categorical
    sql: if(toDayOfWeek(O_ORDERDATE) NOT IN (1, 7), true, false)
    values:
      - value: true
        label: "Рабочий"
      - value: false
        label: "Не рабочий"
    references:
      - semantic_model: orders_analysis
        dimension: is_business_day
      - semantic_model: lineitem_details
        dimension: is_business_day
      - semantic_model: calendar
        dimension: is_business_day
