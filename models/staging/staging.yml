version: 2

models:
  - name: stg_customer
    description: "Стейдинг-модель для данных клиентов"
    meta:
      data_quality:
        owner: analytics_team
        classification: internal
        description: "Стейдинг-модель для данных клиентов"
      data_governance:
        owner: analytics_team
        classification: internal
        pii: false
        sensitive: false
    columns:
      - name: c_custkey
        description: "Ключ клиента"
        tests:
          - unique
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: true
      - name: c_name
        description: "Имя клиента"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: true
      - name: c_address
        description: "Адрес клиента"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: true
      - name: c_nationkey
        description: "Ключ страны"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: false
      - name: c_phone
        description: "Телефон клиента"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: true
      - name: c_acctbal
        description: "Баланс счета клиента"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: false
      - name: c_mktsegment
        description: "Сегмент рынка"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: false
      - name: c_comment
        description: "Комментарий клиента"
        tests:
          - not_null
        meta:
          data_governance:
            classification: internal
            pii: false

  - name: dim_calendar
    description: "Унифицированное временное измерение для анализа по датам"
    columns:
      - name: date_day
        description: "День календаря"
        tests:
          - unique
          - not_null

      - name: year
        description: "Год"
        tests:
          - not_null

      - name: month
        description: "Месяц"
        tests:
          - not_null

      - name: month_start
        description: "Начало месяца"
        tests:
          - not_null

      - name: quarter
        description: "Квартал"
        tests:
          - not_null

      - name: quarter_start
        description: "Начало квартала"
        tests:
          - not_null

      - name: week_of_year
        description: "Неделя года"
        tests:
          - not_null

      - name: week_start
        description: "Начало недели"
        tests:
          - not_null

      - name: day_of_week
        description: "День недели (1=Пн, 7=Вс)"
        tests:
          - not_null

      - name: day_of_year
        description: "День года"
        tests:
          - not_null

      - name: date_key
        description: "Ключ даты в формате YYYY-MM-DD"
        tests:
          - unique
          - not_null

      - name: date_formatted
        description: "Форматированная дата DD.MM.YYYY"
        tests:
          - not_null

      - name: month_year
        description: "Месяц и год"
        tests:
          - not_null

      - name: quarter_year
        description: "Квартал и год"
        tests:
          - not_null

      - name: is_holiday
        description: "Выходной день"
        tests:
          - not_null

      - name: is_weekend
        description: "Выходной день (сб, вс)"
        tests:
          - not_null

      - name: is_business_day
        description: "Рабочий день"
        tests:
          - not_null

      - name: is_christmas_season
        description: "Рождественский сезон"
        tests:
          - not_null

      - name: is_january_buying_season
        description: "Сезон январских покупок"
        tests:
          - not_null

      - name: season
        description: "Время года"
        tests:
          - not_null

      - name: half_year
        description: "Полугодие"
        tests:
          - not_null

      - name: time_id
        description: "Идентификатор времени"
        tests:
          - unique
          - not_null
